*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#0a0806}
body{font-family:'Amiri',serif;color:#f3e3bf}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 35%,#241a0e 0,#0a0806 65%);z-index:5}

.orb{width:120px;height:120px;margin-bottom:26px;animation:spin 24s linear infinite}

#lock h1{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:2.6rem;margin:0 0 6px;background:linear-gradient(180deg,#fff2cf,#d9b56b 60%,#9c7430);-webkit-background-clip:text;background-clip:text;color:transparent}

#pw{width:min(320px,80vw);padding:14px 18px;background:transparent;border:0;border-bottom:1px solid rgba(217,181,107,.6);color:#fff2cf;font:inherit;font-size:1.2rem;text-align:center;outline:0}
#pw:focus{border-bottom-color:#f3d58b;box-shadow:0 10px 24px -14px #d9b56b}
#err{min-height:1.5em;margin:10px 0 6px;color:#e59a8f;font-size:1rem}
#go{font-family:'Reem Kufi',sans-serif;font-size:1.05rem;letter-spacing:.04em;padding:12px 38px;border:1px solid #d9b56b;background:linear-gradient(180deg,rgba(217,181,107,.18),rgba(217,181,107,.04));color:#f3e3bf;cursor:pointer;transition:.3s}

#stage{display:none}

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.i,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.v)},key,b(P.c))))}
const err=document.getElementById('err');
async function tryGo(){err.textContent='';let d;try{d=await unlock(document.getElementById('pw').value.trim())}catch(e){err.textContent='مش دي الكلمة... جرّبي تاني';return}

new Function(d.js)()}
